items:
  # Lesson 1: The AFL takes on the NFL
  - id: nfl.history.hunt-founds-afl
    sportId: nfl
    track: past
    kind: moment
    label: Lamar Hunt starts the AFL
    statement: In 1959, Lamar Hunt, a 26-year-old from Dallas frustrated in his attempts to get an NFL franchise, set out to form a rival league; within seven months the American Football League was born.
    whyItMatters: The AFL exists because the NFL kept saying no to Hunt.
    eraId: nfl.era.afl-rivalry
    tags: [era:nfl.era.afl-rivalry]
    availableCues: [name, timeline]
    sources:
      - <<: *hunt
        quote: 'In 1959, a young man, totally frustrated in his repeated attempts to gain a franchise in the National Football League, hit upon an idea. The young man was Lamar Hunt, a 26-year-old sports-minded, civic-minded individual who called Dallas home, and his idea, simply, was to form a new professional football league to rival the NFL. … within seven months, the American Football League was born.'
    lastVerifiedAt: 2026-10-04
    reviewStatus: in_review

  - id: nfl.history.merger-announced
    sportId: nfl
    track: past
    kind: moment
    label: The merger is announced (1966)
    statement: After secret meetings between Lamar Hunt and Tex Schramm, Commissioner Pete Rozelle announced the AFL-NFL merger on June 8, 1966.
    derivedValues:
      - { value: '1966', from: the year of the Hall of Fame chronology entry quoted }
    whyItMatters: The agreement also created an annual championship game between the leagues, the game we now call the Super Bowl.
    eraId: nfl.era.afl-rivalry
    tags: [era:nfl.era.afl-rivalry]
    availableCues: [name, timeline]
    sources:
      - <<: *hof1966
        quote: 'A series of secret meetings regarding a possible AFL-NFL merger were held in the spring between Lamar Hunt of Kansas City and Tex Schramm of Dallas. Rozelle announced the merger on June 8. … the leagues agreed to play an annual AFL-NFL World Championship Game beginning in January of 1967'
      - <<: *hof1966
        quote: 'Commissioner Pete Rozelle'
      - <<: *hof1969
        quote: 'The title Super Bowl was recognized by the NFL for the first time.'
    lastVerifiedAt: 2026-10-04
    reviewStatus: in_review

  - id: nfl.history.lombardi-packers
    sportId: nfl
    track: past
    kind: coach
    label: Lombardi's Packers
    statement: Vince Lombardi became head coach and general manager of the Green Bay Packers at age 45; in the next eight years the Packers won six divisional and five NFL championships, plus Super Bowls I and II.
    whyItMatters: Five NFL championships and the first two Super Bowls, all in eight years.
    entityIds: [nfl.coach.vince-lombardi, nfl.team.packers]
    eraId: nfl.era.afl-rivalry
    tags: [era:nfl.era.afl-rivalry, team:nfl.team.packers]
    availableCues: [name, stat]
    sources:
      - <<: *lombardi
        quote: 'Vince Lombardi, at the age of 45, when most pro football luminaries have made their mark and passed from the scene of a young man''s game, was embarking on the dual adventure of being head coach and general manager of the Green Bay Packers.'
      - <<: *lombardi
        quote: 'The next eight years, the Packers were in a class by themselves, winning six divisional and five NFL championships and achieving victories in Super Bowls I and II.'
    lastVerifiedAt: 2026-10-04
    reviewStatus: in_review

  - id: nfl.history.super-bowl-i
    sportId: nfl
    track: past
    kind: moment
    label: Super Bowl I
    statement: In the first AFL-NFL World Championship Game, now known as Super Bowl I, the Green Bay Packers beat the Kansas City Chiefs 35-10 on January 15, 1967.
    derivedValues:
      - { value: '1967', from: the year of the Hall of Fame chronology entry quoted }
    whyItMatters: It was the first game ever played between AFL and NFL teams.
    entityIds: [nfl.team.packers, nfl.team.chiefs]
    eraId: nfl.era.afl-rivalry
    tags: [era:nfl.era.afl-rivalry, team:nfl.team.packers, team:nfl.team.chiefs]
    availableCues: [name, stat, timeline]
    sources:
      - <<: *hof1967
        quote: 'Green Bay earned the right to represent the NFL in the first AFL-NFL World Championship Game by defeating Dallas 34-27 on January 1. The same day, Kansas City defeated Buffalo 31-7 to represent the AFL. The Packers defeated the Chiefs 35-10 before 61,946 fans at the Los Angeles Memorial Coliseum in the first game between AFL and NFL teams on January 15.'
      - <<: *lombardi
        quote: 'achieving victories in Super Bowls I and II.'
      - <<: *hof1969
        quote: 'The title Super Bowl was recognized by the NFL for the first time.'
    lastVerifiedAt: 2026-10-04
    reviewStatus: in_review

  - id: nfl.history.super-bowl-ii
    sportId: nfl
    track: past
    kind: moment
    label: Super Bowl II
    statement: Green Bay beat Oakland 33-14 in Super Bowl II at Miami on January 14, 1968.
    derivedValues:
      - { value: '1968', from: the year of the Hall of Fame chronology entry quoted }
    whyItMatters: Two Super Bowls, two NFL wins; the AFL still had something to prove.
    entityIds: [nfl.team.packers]
    eraId: nfl.era.afl-rivalry
    tags: [era:nfl.era.afl-rivalry, team:nfl.team.packers]
    availableCues: [name, stat, timeline]
    sources:
      - <<: *hof1968
        quote: 'Green Bay defeated Oakland 33-14 in Super Bowl II at Miami on January 14.'
    lastVerifiedAt: 2026-10-04
    reviewStatus: in_review

  # Lesson 2: The AFL strikes back
  - id: nfl.history.super-bowl-iii
    sportId: nfl
    track: past
    kind: moment
    label: Super Bowl III
    statement: The New York Jets beat the Baltimore Colts 16-7 in Super Bowl III on January 12, 1969, the first Super Bowl won by an AFL team.
    derivedValues:
      - { value: '1969', from: the year of the Hall of Fame chronology entry quoted }
    whyItMatters: The Hall of Fame calls it a stunning upset of a heavily favored NFL team.
    entityIds: [nfl.team.jets, nfl.player.joe-namath]
    eraId: nfl.era.afl-rivalry
    tags: [era:nfl.era.afl-rivalry, team:nfl.team.jets]
    availableCues: [name, stat, timeline]
    sources:
      - <<: *hof1969
        quote: 'An AFL team won the Super Bowl for the first time, as the Jets defeated the Colts 16-7 at Miami on January 12 in Super Bowl III.'
      - <<: *namath
        quote: 'Joe Namath is best remembered for his performance in the New York Jets'' stunning 16-7 upset of the heavily favored Baltimore Colts in Super Bowl III.'
    lastVerifiedAt: 2026-10-04
    reviewStatus: in_review

  - id: nfl.history.namath-guarantee
    sportId: nfl
    track: past
    kind: player
    label: Namath's guarantee
    statement: Joe Namath made a pregame "guarantee" before Super Bowl III and was named its MVP; the Hall of Fame credits both with helping assure the competitive viability of the AFL-NFL Super Bowl series.
    whyItMatters: One quarterback's promise, kept, made the young Super Bowl a real contest.
    entityIds: [nfl.player.joe-namath, nfl.team.jets]
    eraId: nfl.era.afl-rivalry
    tags: [era:nfl.era.afl-rivalry, team:nfl.team.jets, position:quarterback]
    availableCues: [name]
    sources:
      - <<: *namath
        quote: 'His performance in the Jets’ win over the Colts in Super Bowl III earned him Super Bowl MVP honors. His pregame “guarantee” and MVP performance were a major factor in assuring the competitive viability of the AFL-NFL Super Bowl series.'
    lastVerifiedAt: 2026-10-04
    reviewStatus: in_review

  - id: nfl.history.super-bowl-iv
    sportId: nfl
    track: past
    kind: moment
    label: Super Bowl IV
    statement: Kansas City beat Minnesota 23-7 in Super Bowl IV in New Orleans on January 11, 1970.
    whyItMatters: The AFL won its second straight Super Bowl just before the leagues merged.
    entityIds: [nfl.team.chiefs]
    eraId: nfl.era.afl-rivalry
    tags: [era:nfl.era.afl-rivalry, team:nfl.team.chiefs]
    availableCues: [name, stat, timeline]
    sources:
      - <<: *hof1970
        quote: 'Kansas City defeated Minnesota 23-7 in Super Bowl IV in New Orleans on January 11.'
    derivedValues:
      - { value: '1970', from: the year of the Hall of Fame chronology entry quoted }
    lastVerifiedAt: 2026-10-04
    reviewStatus: in_review

  - id: nfl.history.lombardi-trophy
    sportId: nfl
    track: past
    kind: moment
    label: The Vince Lombardi Trophy
    statement: Vince Lombardi died on September 3, 1970, and a week later, on September 10, the Super Bowl trophy was renamed the Vince Lombardi Trophy.
    derivedValues:
      - { value: '1970', from: the year of the Hall of Fame chronology entry quoted }
    whyItMatters: The Super Bowl trophy is named for the coach who won the first two.
    entityIds: [nfl.coach.vince-lombardi]
    eraId: nfl.era.merged-league
    tags: [era:nfl.era.afl-rivalry, era:nfl.era.merged-league, team:nfl.team.packers]
    availableCues: [name, timeline]
    sources:
      - <<: *hof1970
        quote: 'Vince Lombardi died of cancer at 57 on September 3. The Super Bowl trophy was renamed the Vince Lombardi trophy on September 10.'
    lastVerifiedAt: 2026-10-04
    reviewStatus: in_review

