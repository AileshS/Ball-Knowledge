name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Same command contributors run locally: format, lint, typecheck, tests + coverage.
      - run: npm run check
      # Proves the app still bundles (Metro + Expo Router) for web. Preview mode,
      # because unreviewed content is expected on branches; releases use export:web.
      - run: npm run export:web:preview -w @ball-knowledge/mobile
