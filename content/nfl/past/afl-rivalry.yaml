tips:
  - id: nfl.tip.first-four-super-bowls
    sportId: nfl
    technique: story
    itemIds:
      [
        nfl.history.super-bowl-i,
        nfl.history.super-bowl-ii,
        nfl.history.super-bowl-iii,
        nfl.history.super-bowl-iv,
      ]
    title: 'The first four Super Bowls: a tug-of-war'
    body: |-
      Picture a tug-of-war between the two leagues.
      The NFL pulls first, twice: Lombardi's Green Bay Packers win Super Bowls I and II.
      Then the AFL pulls back, twice: Joe Namath's New York Jets in III, and Kansas City in IV.
      Two pulls each, and then the rope is tied together in the 1970 merger.
    reviewStatus: in_review

