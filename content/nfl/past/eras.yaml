tips:
  - id: nfl.tip.era-chain
    sportId: nfl
    technique: chain
    itemIds:
      - nfl.history.era-founding
      - nfl.history.era-championship-game
      - nfl.history.era-afl-rivalry
      - nfl.history.era-merged-league
      - nfl.history.era-open-game
      - nfl.history.era-salary-cap
    title: 'A chain of six eras: Canton → Trophy → Rival → Handshake → Open field → Price tag'
    body: |-
      Link each era to a picture, and let each picture lead to the next.
      Canton (1920): teams meet in Canton, Ohio, and name the new league.
      Trophy (1933): two divisions now play for one championship trophy.
      Rival (1960): a rival league, the AFL, kicks off.
      Handshake (1970): the rivals shake hands and become one league.
      Open field (1978): receivers run free past five yards and the game opens up.
      Price tag (1994): a salary cap puts a price tag on every roster.
      The era names are our own labels; the start dates are the documented milestones.
    reviewStatus: in_review

