items:
  # Where each era starts (lesson 1)
  - id: nfl.history.era-founding
    sportId: nfl
    track: past
    kind: era
    label: Founding Era starts (1920)
    statement: Our Founding Era starts on September 17, 1920, when a second organizational meeting in Canton, Ohio, named the new league the American Professional Football Association, the league that became the NFL.
    derivedValues:
      - { value: '1920', from: the year of the Hall of Fame chronology entry quoted }
    whyItMatters: The league met in Canton two years before it ever used the name NFL.
    entityIds: [nfl.era.founding]
    eraId: nfl.era.founding
    tags: [topic:eras, era:nfl.era.founding]
    availableCues: [name, timeline]
    sources:
      - <<: *hof1920
        quote: 'An organizational meeting, at which the Akron Pros, Canton Bulldogs, Cleveland Indians, and Dayton Triangles were represented, was held at the Jordan and Hupmobile auto showroom in Canton, Ohio on August 20. … A second organizational meeting was held in Canton on September 17. … The name of the league was changed to the American Professional Football Association.'
      - <<: *hof1922
        quote: 'The American Professional Football Association changed its name to the National Football League, June 24.'
    lastVerifiedAt: 2026-10-04
    reviewStatus: in_review

  - id: nfl.history.era-championship-game
    sportId: nfl
    track: past
    kind: era
    label: Championship Game Era starts (1933)
    statement: Our Championship Game Era starts in 1933, when the NFL split into two divisions whose winners would meet in an annual championship game.
    derivedValues:
      - { value: '1933', from: the year of the Hall of Fame chronology entry quoted }
    whyItMatters: Until then, no NFL title game was scheduled before the season; now every season built toward one.
    entityIds: [nfl.era.championship-game]
    eraId: nfl.era.championship-game
    tags: [topic:eras, era:nfl.era.championship-game]
    availableCues: [name, timeline]
    sources:
      - <<: *hof1933
        quote: 'Marshall and Halas pushed through a proposal that divided the NFL into two divisions, with the winners to meet in an annual championship game, July 8.'
      - <<: *hof1933
        quote: 'In the first NFL Championship Game scheduled before the season'
    lastVerifiedAt: 2026-10-04
    reviewStatus: in_review

  - id: nfl.history.era-afl-rivalry
    sportId: nfl
    track: past
    kind: era
    label: AFL Rivalry Era starts (1960)
    statement: Our AFL Rivalry Era starts on September 9, 1960, with the first regular-season game of the rival American Football League (AFL).
    derivedValues:
      - { value: '1960', from: the year of the Hall of Fame chronology entry quoted }
    whyItMatters: The two leagues fought over players until their bidding war peaked in 1966.
    entityIds: [nfl.era.afl-rivalry]
    eraId: nfl.era.afl-rivalry
    tags: [topic:eras, era:nfl.era.afl-rivalry]
    availableCues: [name, timeline]
    sources:
      - <<: *hof1960
        quote: 'The Denver Broncos defeated the Patriots 13-10 before 21,597 at Boston in the first AFL regular-season game on September 9.'
      - <<: *hof1966
        quote: 'The AFL-NFL war reached its peak, as the leagues spent a combined $7 million to sign their 1966 draft choices.'
    lastVerifiedAt: 2026-10-04
    reviewStatus: in_review

  - id: nfl.history.era-merged-league
    sportId: nfl
    track: past
    kind: era
    label: Merged League Era starts (1970)
    statement: Our Merged League Era starts in 1970, when the AFL and NFL officially merged into one league with two conferences.
    whyItMatters: The two conferences you know today, the AFC and NFC, date from this merger.
    entityIds: [nfl.era.merged-league]
    eraId: nfl.era.merged-league
    tags: [topic:eras, era:nfl.era.merged-league]
    availableCues: [name, timeline]
    sources:
      - <<: *hof1966
        quote: 'Official regular-season play would start in 1970 when the two leagues would officially merge to form one league with two conferences.'
      - <<: *hof1970
        quote: 'Lamar Hunt was elected president of the AFC and George Halas was elected president of the NFC on March 19.'
    lastVerifiedAt: 2026-10-04
    reviewStatus: in_review

  - id: nfl.history.era-open-game
    sportId: nfl
    track: past
    kind: era
    label: Open Game Era starts (1978)
    statement: Our Open Game Era starts in 1978, when new rules restricted defenders' contact with receivers beyond five yards of the line of scrimmage and the regular-season schedule grew from 14 to 16 weeks.
    derivedValues:
      - { value: '1978', from: the year of the Hall of Fame chronology entry quoted }
    whyItMatters: The Hall of Fame describes these rules as continuing a trend toward opening up the game, which is where our label comes from.
    entityIds: [nfl.era.open-game]
    eraId: nfl.era.open-game
    tags: [topic:eras, era:nfl.era.open-game]
    availableCues: [name, timeline]
    sources:
      - <<: *hof1978
        quote: 'The NFL continued a trend toward opening up the game. Rules changes permitted a defender to maintain contact with a receiver within five yards of the line of scrimmage, but restricted contact beyond that point.'
      - <<: *hof1978
        quote: 'Bolstered by the expansion of the regular-season schedule from 14 to 16 weeks'
    lastVerifiedAt: 2026-10-04
    reviewStatus: in_review

  - id: nfl.history.era-salary-cap
    sportId: nfl
    track: past
    kind: era
    label: Salary Cap Era starts (1994)
    statement: Our Salary Cap Era starts in 1994, the first season of the NFL's salary cap.
    whyItMatters: Every season since has had a salary cap except one, 2010, which the league lists as "No Cap".
    entityIds: [nfl.era.salary-cap]
    eraId: nfl.era.salary-cap
    tags: [topic:eras, era:nfl.era.salary-cap]
    availableCues: [name, timeline]
    sources:
      - <<: *salaryCap
        quote: 'Below is the NFL’s salary for each season since it was conceived in 1994.'
      - <<: *salaryCap
        quote: '2010 No Cap'
    lastVerifiedAt: 2026-10-04
    reviewStatus: in_review

  # From Canton to the first title game (lesson 2)
  - id: nfl.history.renamed-nfl
    sportId: nfl
    track: past
    kind: moment
    label: The NFL gets its name
    statement: The American Professional Football Association changed its name to the National Football League on June 24, 1922.
    derivedValues:
      - { value: '1922', from: the year of the Hall of Fame chronology entry quoted }
    whyItMatters: The league was two years old before it was called the NFL.
    entityIds: [nfl.era.founding]
    eraId: nfl.era.founding
    tags: [topic:eras, era:nfl.era.founding]
    availableCues: [name, timeline]
    sources:
      - <<: *hof1922
        quote: 'The American Professional Football Association changed its name to the National Football League, June 24. The Chicago Staleys became the Chicago Bears.'
    lastVerifiedAt: 2026-10-04
    reviewStatus: in_review

  - id: nfl.history.canton-powerhouse
    sportId: nfl
    track: past
    kind: moment
    label: Canton's 1922 powerhouse
    statement: In 1922, Canton went 10-0-2 and emerged as the league's first true powerhouse.
    derivedValues:
      - { value: '1922', from: the year of the Hall of Fame chronology entry quoted }
    whyItMatters: The city where the league was formed also produced its first dominant team.
    entityIds: [nfl.era.founding]
    eraId: nfl.era.founding
    tags: [topic:eras, era:nfl.era.founding]
    availableCues: [name, stat]
    sources:
      - <<: *hof1922
        quote: 'Canton, led by player-coach Guy Chamberlin and tackles Link Lyman and Wilbur (Pete) Henry, emerged as the league''s first true powerhouse, going 10-0-2.'
    lastVerifiedAt: 2026-10-04
    reviewStatus: in_review

  - id: nfl.history.first-title-game
    sportId: nfl
    track: past
    kind: moment
    label: The first scheduled title game
    statement: In the first NFL Championship Game scheduled before the season, the Chicago Bears beat the Giants 23-21 at Wrigley Field on December 17, 1933.
    derivedValues:
      - { value: '1933', from: the year of the Hall of Fame chronology entry quoted }
    whyItMatters: It was the first season to end with the championship game the new two-division format promised.
    entityIds: [nfl.era.championship-game]
    eraId: nfl.era.championship-game
    tags: [topic:eras, era:nfl.era.championship-game]
    availableCues: [name, stat, timeline]
    sources:
      - <<: *hof1933
        quote: 'In the first NFL Championship Game scheduled before the season, the Western Division champion Bears defeated the Eastern Division champion Giants 23-21 at Wrigley Field on December 17.'
      - <<: *hof1922
        quote: 'The Chicago Staleys became the Chicago Bears.'
    lastVerifiedAt: 2026-10-04
    reviewStatus: in_review

  - id: nfl.history.forward-pass-1933
    sportId: nfl
    track: past
    kind: rule
    label: The forward pass opens up (1933)
    statement: In 1933, the NFL legalized the forward pass from anywhere behind the line of scrimmage.
    derivedValues:
      - { value: '1933', from: the year of the Hall of Fame chronology entry quoted }
    whyItMatters: It was one of the first rules the NFL wrote for itself instead of following the college game.
    eraId: nfl.era.championship-game
    tags: [topic:eras, era:nfl.era.championship-game]
    availableCues: [name, timeline]
    sources:
      - <<: *hof1933
        quote: 'The NFL, which long had followed the rules of college football, made a number of significant changes from the college game for the first time and began to develop rules serving its needs and the style of play it preferred. … Also the forward pass was legalized from anywhere behind the line of scrimmage on February 25.'
    lastVerifiedAt: 2026-10-04
    reviewStatus: in_review

  # Merger to the modern game (lesson 3)
  - id: nfl.history.names-on-jerseys
    sportId: nfl
    track: past
    kind: rule
    label: Names on jerseys (1970)
    statement: In 1970, the merged 26-team league adopted rules putting players' names on the backs of their jerseys.
    derivedValues:
      - { value: '1970', from: the year of the Hall of Fame chronology entry quoted }
    whyItMatters: Something every fan now takes for granted arrived with the merged league.
    eraId: nfl.era.merged-league
    tags: [topic:eras, era:nfl.era.merged-league]
    availableCues: [name, timeline]
    sources:
      - <<: *hof1970
        quote: 'The merged 26-team league adopted rules changes putting names on the backs of players'' jerseys'
    lastVerifiedAt: 2026-10-04
    reviewStatus: in_review

  - id: nfl.history.two-point-conversion
    sportId: nfl
    track: past
    kind: rule
    label: The two-point conversion arrives (1994)
    statement: In 1994, NFL clubs adopted the two-point conversion and moved the kickoff back to the 30-yard line, as part of a package of changes meant to increase offensive production.
    derivedValues:
      - { value: '1994', from: the year of the Hall of Fame chronology entry quoted }
    whyItMatters: Since the 1970 merger rules, the try had been worth only one point; this change brought back the choice to go for two.
    eraId: nfl.era.salary-cap
    tags: [topic:eras, era:nfl.era.salary-cap, topic:try]
    availableCues: [name, timeline]
    sources:
      - <<: *hof1994
        quote: 'In a move to increase offensive production, NFL clubs at the league''s annual meeting in Orlando adopted a package of changes, including modifications in line play, chucking rules and the roughing-the-passer rule, plus the adoption of the two-point conversion and moving the spot of the kickoff back to the 30-yard line on March 22.'
      - <<: *hof1970
        quote: 'making a point after touchdown worth only one point'
      - <<: *hof1960
        quote: 'The AFL adopted the two-point option on points after touchdown on January 28.'
    lastVerifiedAt: 2026-10-04
    reviewStatus: in_review

  - id: nfl.history.first-salary-cap
    sportId: nfl
    track: past
    kind: stat
    label: The first salary cap
    statement: In its first season, 1994, the NFL salary cap was $34.6 million.
    whyItMatters: Compare it with today's cap to see how much the league's finances have grown.
    eraId: nfl.era.salary-cap
    tags: [topic:eras, era:nfl.era.salary-cap]
    availableCues: [stat, timeline]
    sources:
      - <<: *salaryCap
        quote: 'since it was conceived in 1994. … 1995 $37.1M 1994 $34.6M'
    lastVerifiedAt: 2026-10-04
    reviewStatus: in_review

  - id: nfl.history.seventeen-games
    sportId: nfl
    track: past
    kind: rule
    label: The 17-game season (2021)
    statement: In 2021, NFL clubs approved a season with each team playing 17 regular-season games, the league's first scheduling structure change since 1978.
    derivedValues:
      - { value: '2021', from: the year of the Hall of Fame chronology entry quoted }
    whyItMatters: The last change before it was the 1978 move to 16 weeks, the same year our Open Game Era begins.
    eraId: nfl.era.salary-cap
    tags: [topic:eras, era:nfl.era.salary-cap, topic:season]
    availableCues: [name, stat, timeline]
    sources:
      - <<: *hof2021
        quote: 'Commissioner Roger Goodell and the NFL announced an enhanced season structure with each team playing 17 regular-season games on March 30. At a virtual league meeting, NFL clubs approved the league’s first scheduling structure change since 1978.'
    lastVerifiedAt: 2026-10-04
    reviewStatus: in_review

