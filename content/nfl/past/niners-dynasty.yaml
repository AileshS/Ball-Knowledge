# Past track deep dive: our Open Game Era (1978-1993) and the 49ers dynasty
#
# Bill Walsh, Joe Montana, and Jerry Rice. Sources are the Pro Football Hall of
# Fame's chronology and enshrinee biographies, checked on 2026-10-04, each with a
# verbatim quote. Super Bowl XXIX (January 1995) falls in our Salary Cap Era and
# is tagged that way; it's here because it completes the dynasty's story.
# Status: in_review. The owner approves before anything ships.

