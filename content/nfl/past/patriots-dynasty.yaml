# Past track deep dive: our Salary Cap Era, the Patriots dynasty and Tom Brady
#
# Sources are the Pro Football Hall of Fame's year-by-year chronology, checked on
# 2026-10-04, each with a verbatim quote. Brady is not yet enshrined, so his facts
# come from the chronology, not a biography.
# Status: in_review. The owner approves before anything ships.

